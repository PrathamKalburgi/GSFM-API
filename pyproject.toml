[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-file-measurement"
version = "0.1.0"
description = "API that accepts KML and zipped Shapefiles and returns area and length measurements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<2.2",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "geopandas>=1.2,<2",
    "pyogrio>=0.13,<1",
    "shapely>=2.2,<3",
    "pyproj>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.isort]
# The repo has an `alembic/` folder, which ruff would otherwise treat as first-party.
known-third-party = ["alembic"]
